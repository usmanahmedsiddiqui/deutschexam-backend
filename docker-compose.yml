version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: deutschexam
      POSTGRES_USER: deutschexam
      POSTGRES_PASSWORD: deutschexam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deutschexam"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"   # SMTP — server sends emails here
      - "8025:8025"   # Web UI — open http://localhost:8025 to read OTP emails

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/deutschexam
      DATABASE_USER: deutschexam
      DATABASE_PASSWORD: deutschexam
      JWT_SECRET: dev-secret-change-in-production-min-32-chars
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: noreply@deutschexam.com
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
