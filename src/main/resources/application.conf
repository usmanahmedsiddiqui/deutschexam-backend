ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.deutschexam.backend.ApplicationKt.module ]
    }
}

app {
    # "dev" (default) relaxes secret validation for local use; "prod" enforces it (SEC-3).
    environment = "dev"
    environment = ${?APP_ENVIRONMENT}
}

jwt {
    secret = "dev-secret-change-in-production-min-32-chars"
    secret = ${?JWT_SECRET}
    issuer = "deutschexam-backend"
    expiry_hours = 24
}

database {
    url = "jdbc:postgresql://localhost:5432/deutschexam"
    url = ${?DATABASE_URL}
    user = "deutschexam"
    user = ${?DATABASE_USER}
    password = "deutschexam"
    password = ${?DATABASE_PASSWORD}
    driver = "org.postgresql.Driver"
    pool_size = 10
}

google {
    client_id = ""
    client_id = ${?GOOGLE_CLIENT_ID}
}
