ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.deutschexam.backend.ApplicationKt.module ]
    }
}

jwt {
    secret = "dev-secret-change-in-production-min-32-chars"
    secret = ${?JWT_SECRET}
    issuer = "deutschexam-backend"
    expiry_hours = 24
}

database {
    url = "jdbc:postgresql://localhost:5432/deutschexam"
    url = ${?DATABASE_URL}
    user = "deutschexam"
    user = ${?DATABASE_USER}
    password = "deutschexam"
    password = ${?DATABASE_PASSWORD}
    driver = "org.postgresql.Driver"
    pool_size = 10
}

email {
    host = "localhost"
    host = ${?SMTP_HOST}
    port = 1025
    port = ${?SMTP_PORT}
    username = ""
    username = ${?SMTP_USERNAME}
    password = ""
    password = ${?SMTP_PASSWORD}
    from = "noreply@deutschexam.com"
    from = ${?SMTP_FROM}
    use_tls = false
    use_tls = ${?SMTP_USE_TLS}
}
